<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS em linha</title>
</head>
<body>
    <main>
        <h1>DCC202 CSS em Linha</h1>
        <p>Você pode aplicar um estilo <em style="color: blueviolet;">em Linha</em>
        para um elemento usando o atributo <code style="color: aqua; text-decoration: underline; font-family: Verdana, Geneva, Tahoma, sans-serif;">style</code>.
        </p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Altera cor do elemento.</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
    
</body>
</html>
