<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em {
            color: blueviolet;
        }
        code {
            color: aqua;
            text-decoration: underline; 
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }
        body > main > dl > div:nth-child(2) > dt > code {
            background-color: black;
            color: aqua;
        }
        
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Embutido</h1>
        <p>Você pode aplicar um estilo <em>Embutido</em>
        para um elemento usando o elemento <code>style</code>
        no head.
        </p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Altera cor do elemento.</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
    
</body>
</html>
