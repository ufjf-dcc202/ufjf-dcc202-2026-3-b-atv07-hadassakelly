<!DOCTYPE html>

<head>

    <title>DCC202 CSS Externo</title>
    <link rel="stylesheet" href="estilo.css">

<body>
    <main>
        <h1>DCC202 CSS Externo</h1>

                <dd>Cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
